data:
  train_files: local_datasets/questioner_dummy/train/train-00000-of-00001.parquet
  val_files: local_datasets/questioner_dummy/test/test-00000-of-00001.parquet
  prompt_key: problem
  answer_key: answer
  image_key: images
  max_prompt_length: 512  # Reduced for faster testing
  max_response_length: 256  # Reduced from 2048 to 256 for faster generation/testing
  rollout_batch_size: 128  # Reduced from 1024 to 128 for faster testing
  val_batch_size: 1024
  format_prompt: ./examples/format_prompt/math_format.jinja
  override_chat_template: null
  shuffle: true
  seed: 1
  max_pixels: 4194304
  min_pixels: 262144
  filter_overlong_prompts: true

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2
  mock_data: test

worker:
  actor:
    global_batch_size: 128  # Reduced from 512 to 128 for faster testing
    micro_batch_size_per_device_for_update: 4  # Reduced from 8 to 4 for faster testing
    micro_batch_size_per_device_for_experience: 8  # Reduced from 16 to 8 for faster testing
    max_grad_norm: 1.0
    padding_free: true
    ulysses_sequence_parallel_size: 1
    model:
      model_path: Qwen/Qwen2.5-7B-Instruct
      enable_gradient_checkpointing: false  # Disabled for faster training (requires more GPU memory)
      trust_remote_code: false
      freeze_vision_tower: false
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw  # {adamw, adamw_bf16}
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: false  # Changed to false to use GPU memory for faster training
      offload_optimizer: false  # Changed to false to use GPU memory for faster training

  rollout:
    n: 2  # Reduced from 5 to 2 for faster testing (fewer samples per prompt)
    temperature: 1.0
    top_p: 0.99
    gpu_memory_utilization: 0.85  # Increased from 0.7 to 0.85 to better utilize GPU memory
    enforce_eager: false
    enable_chunked_prefill: true  # Enabled for faster inference
    tensor_parallel_size: 4  # Increased from 2 to 4 to better utilize 8 GPUs (can try 8 if memory allows)
    max_num_batched_tokens: 8192  # Reduced from 16384 to 8192 for faster testing
    limit_images: 0
    val_override_config:
      temperature: 1.0
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false  # Changed to false to use GPU memory for faster inference
      enable_rank0_init: true
    offload:
      offload_params: false  # Changed to false to use GPU memory for faster inference

  reward:
    reward_type: batch
    reward_function: ./examples/reward_function/math.py:compute_score

trainer:
  total_epochs: 2
  max_steps: null
  project_name: easy_r1
  experiment_name: qwen2_5_7b_math_grpo
  logger: ["console"]
  nnodes: 1
  n_gpus_per_node: 8
  val_freq: -1  # -1 to disable
  val_before_train: false  # Set to false to disable validation before training
  val_only: false
  val_generations_to_log: 3
  save_freq: 5  # -1 to disable
  save_limit: 3  # -1 to disable
  save_checkpoint_path: your_checkpoint_path
  load_checkpoint_path: null