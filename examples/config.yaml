data:
  train_files: local_datasets/questioner_dummy/train/train-00000-of-00001.parquet
  val_files: local_datasets/questioner_dummy/test/test-00000-of-00001.parquet
  prompt_key: raw_problem
  answer_key: answer
  image_key: images
  max_prompt_length: 8192  # Increased for better prompt handling
  max_response_length: 32768  # Increased for longer code generation
  rollout_batch_size: 512  # Reduced from 1024 to 128 for faster testing
  val_batch_size: 1024
  format_prompt: null
  override_chat_template: null
  shuffle: true
  seed: 1
  max_pixels: 4194304
  min_pixels: 262144
  filter_overlong_prompts: true

algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2
  mock_data: test

worker:
  actor:
    global_batch_size: 128  # Reduced from 512 to 128 for faster testing
    micro_batch_size_per_device_for_update: 2  
    micro_batch_size_per_device_for_experience: 8  
    max_grad_norm: 1.0
    padding_free: true
    ulysses_sequence_parallel_size: 1
    model:
      model_path: Qwen/Qwen2.5-7B-Instruct
      enable_gradient_checkpointing: true  
      trust_remote_code: false
      freeze_vision_tower: false
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw  # {adamw, adamw_bf16}
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
    offload:
      offload_params: true  
      offload_optimizer: true  

  rollout:
    n: 5  
    temperature: 0.6  # 与 fs-eval 保持一致
    top_p: 0.95  # 与 fs-eval 保持一致
    top_k: 20  # 与 fs-eval 保持一致
    gpu_memory_utilization: 0.7  
    enforce_eager: false
    enable_chunked_prefill: true  # Enabled for faster inference
    tensor_parallel_size: 4  
    limit_images: 0
    val_override_config:
      temperature: 0.6  # 与 fs-eval 保持一致
      top_p: 0.95  # 与 fs-eval 保持一致
      top_k: 20  # 与 fs-eval 保持一致
      n: 1

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true  
      enable_rank0_init: true
    offload:
      offload_params: true  

  reward:
    reward_type: batch
    reward_function: ./examples/reward_function/kernel_cuda.py:compute_score

trainer:
  total_epochs: 2
  max_steps: null
  project_name: easy_r1
  experiment_name: qwen2_5_7b_math_grpo
  logger: ["console"]
  nnodes: 1
  n_gpus_per_node: 8
  val_freq: -1  # -1 to disable
  val_before_train: false  # Set to false to disable validation before training
  val_only: false
  val_generations_to_log: 3
  save_freq: 5  # -1 to disable
  save_limit: 3  # -1 to disable
  save_checkpoint_path: null
  load_checkpoint_path: null